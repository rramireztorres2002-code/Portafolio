<footer class="ae-container-fluid rk-footer">
  <div class="ae-grid ae-grid--collapse">
    <div class="ae-grid__item item-lg-4 au-xs-ta-center au-lg-ta-left">
      <ul class="rk-menu rk-footer-menu">
        <li class="rk-menu__item">
          <a routerLink="/contact" class="rk-menu__link"></a>
          <a routerLink="/about" class="rk-menu__link">Contact Us</a>
        </li>
      </ul>
      <p class="rk-footer__text rk-footer__copy">
        <span class="ae-u-bold">© </span
        ><span class="ae-u-bolder">{{ year }} URKU PORTFOLIO </span>All Right Reserved.
      </p>
    </div>
    <div class="ae-grid__item item-lg-4 au-xs-ta-center">
      <a target="_blank" [href]="infoPagina.InfoPagina.facebook" class="rk-social-btn"
        ><svg><use href="assets/img/symbols.svg#icon-facebook"></use></svg></a
      ><a target="_blank" [href]="infoPagina.InfoPagina.twitter" class="rk-social-btn"
        ><svg><use href="assets/img/symbols.svg#icon-twitter"></use></svg></a
      ><a target="_blank" [href]="infoPagina.InfoPagina.instagram" class="rk-social-btn"
        ><svg><use href="assets/img/symbols.svg#icon-pinterest"></use></svg></a
      ><a target="_blank" [href]="infoPagina.InfoPagina.tumblr" class="rk-social-btn"
        ><svg><use href="assets/img/symbols.svg#icon-tumblr"></use></svg
      ></a>
    </div>
    <div class="ae-grid__item item-lg-4 au-xs-ta-center au-lg-ta-right">
      <p class="rk-footer__text rk-footer__contact">
        <span class="ae-u-bold">Email: </span
        ><span class="ae-u-bolder">
          <a [href]="'mailto:' + infoPagina.InfoPagina.email">
            {{ infoPagina.InfoPagina.email }}
          </a>
        </span>
      </p>
      <p class="rk-footer__text rk-footer__by">
        Theme by <a href="http://pixeden.com" class="ae-u-bolder">Pixeden.</a>
      </p>
    </div>
  </div>
</footer>
